{% extends 'base.html' %}
{% block content %}
<div class="card">
    <h2>Analysis Module</h2>
    <p style="margin-bottom: 15px;">Simple analytical outputs based only on the <strong>fictional Sample Dataset</strong>.</p>
    
    <div class="kpi-grid" style="margin-bottom: 30px;">
        <div class="kpi-card">
            <h3>Total Employees</h3>
            <p>{{ kpis.total_employees }}</p>
        </div>
        <div class="kpi-card">
            <h3>Avg Salary</h3>
            <p>₹{{ kpis.avg_salary }}</p>
        </div>
        <div class="kpi-card">
            <h3>Total Departments</h3>
            <p>{{ kpis.total_departments }}</p>
        </div>
    </div>
    
    <div style="width: 50%; max-width: 500px; margin: 0 auto;">
        <canvas id="deptChart"></canvas>
    </div>
</div>

<script>
    const ctx = document.getElementById('deptChart').getContext('2d');
    const deptChart = new Chart(ctx, {
        type: 'pie',
        data: {
            labels: {{ labels_dept | tojson }},
            datasets: [{
                label: 'Employees by Department',
                data: {{ data_dept | tojson }},
                backgroundColor: [
                    '#0056b3',
                    '#28a745',
                    '#ffc107',
                    '#dc3545'
                ],
                borderWidth: 1
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    position: 'bottom',
                },
                title: {
                    display: true,
                    text: 'Employees by Department'
                }
            }
        }
    });
</script>
{% endblock %}
